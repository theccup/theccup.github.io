<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Cunt Cup</title>
<meta name="theme-color" content="#DDE2E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cunt Cup">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}[hidden]{display:none!important}
.pin input[type=email],.pin input[type=password]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px;font:inherit;width:100%}
</style>
<style id="app-style">
/* Layout: stadium scoreboard — condensed display numerals, team-colour stripes, standings first, events second, archive as a roll of honour */
:root{
  /* Fog: cool blue-grey ground, soft grey cards (no white), navy ink, brass details. Single light look on purpose. */
  --bg:#DDE2E8; --surface:#EAEEF2; --surface-2:#D3D9E0; --ink:#16213A; --muted:#5B6678; --line:#C5CDD7;
  --accent:#16213A; --accent-ink:#EAEEF2; --gold:#B58B2E; --silver:#8E98A6; --bronze:#A0653A;
  --good:#1E7F4E; --warn:#B07316; --danger:#B83A2E;
  --f-display:"Big Shoulders Display","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; color-scheme:light;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
#app{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:20px 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.hero{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:8px 18px;border-bottom:3px solid var(--ink);padding-right:48px}
.cog{position:absolute;top:4px;right:0;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.cog:hover{color:var(--ink);border-color:var(--ink)}
.cog.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cog-menu{position:absolute;top:50px;right:0;z-index:15;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cog-menu .lbl{margin:0}
.cog-menu .btn{justify-content:center}
.hero.compact .cog{top:50%;transform:translateY(-50%)}
.hero.compact .cog-menu{top:calc(50% + 28px)}
.hero-main{min-width:0}
.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font-family:var(--f-display);font-weight:900;font-size:clamp(46px,11vw,92px);line-height:.88;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.acro{margin:8px 0 0;font-size:14px;color:var(--muted)}
.acro b{color:var(--ink);font-weight:700}
.motto{margin:10px 0 0;display:inline-block;font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding-block:3px}
.motto span{font-family:var(--f-body);font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:none;color:var(--muted)}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.status{font-size:13px;color:var(--muted);text-align:right}
.status strong{color:var(--ink)}
@media (max-width:600px){.hero-side{align-items:flex-start;width:100%}.status{text-align:left}}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.small{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding-block:12px;margin-bottom:6px;overflow-x:auto}
.tab{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);letter-spacing:.02em;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}

h2{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;text-transform:uppercase;margin:0 0 10px;line-height:1}
h3{font-size:17px;margin:0;font-weight:700}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-note{font-size:13px;color:var(--muted);margin:0 0 10px}
.grid2{display:grid;gap:28px}
@media (min-width:860px){.grid2{grid-template-columns:5fr 6fr}}
.grid2>*{min-width:0}
section{margin-top:18px}

.teams{display:flex;flex-direction:column;gap:10px}
.team{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--tc);border-radius:var(--r);padding:12px 14px 12px 10px}
.team .rk{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1;text-align:center}
.team.lead .rk{color:var(--gold)}
.team-name{font-weight:700;font-size:17px;line-height:1.2}
.team-members{font-size:12.5px;color:var(--muted);margin-top:2px}
.bar{height:6px;background:var(--surface-2);border-radius:3px;margin-top:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tc);border-radius:3px}
.pts{text-align:right}
.pts b{display:block;font-family:var(--f-display);font-weight:800;font-size:38px;line-height:1}
.pts small{font-size:12px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td.c,th.c{text-align:center}
.rkc{font-family:var(--f-display);font-weight:800;font-size:20px;width:42px;white-space:nowrap}
.pl-name{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none;border:1px solid rgba(0,0,0,.15)}
.medals{display:inline-flex;gap:6px;white-space:nowrap}
.medal{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 5px;border-radius:11px;font-size:12px;font-weight:700;color:#111;font-variant-numeric:tabular-nums}
.medal.g{background:var(--gold)} .medal.s{background:var(--silver)} .medal.b{background:var(--bronze);color:#fff}
.bigpts{font-family:var(--f-display);font-weight:800;font-size:22px}
.dash{color:var(--muted)}

.events{display:grid;gap:12px}
@media (min-width:640px){.events{grid-template-columns:1fr 1fr}}
.ev{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
button.ev:hover{border-color:var(--ink)}
.ev-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev-no{font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;color:var(--muted);min-width:30px}
.ev-name{font-weight:700;font-size:18px;flex:1;min-width:0}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;align-self:flex-start}
.pill.done{background:var(--good);border-color:var(--good);color:#fff}
.pill.next{background:var(--warn);border-color:var(--warn);color:#111}
.podium{display:flex;flex-direction:column;gap:4px;font-size:14px}
.podium div{display:flex;align-items:center;gap:8px}
.empty{font-size:14px;color:var(--muted)}

.detail-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.detail-head h2{margin:0;flex:1 1 auto;min-width:0;overflow-wrap:anywhere}
.detail-head .dir{flex:none}
@media (max-width:600px){.detail-head h2{flex-basis:100%}}
.edit-tools{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
.tapnote{font-size:13px;color:var(--muted)}
.add-ev{margin-bottom:12px}
.card .add-ev{margin-bottom:0;padding-bottom:10px;border-bottom:1px solid var(--line)}
select.place{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;font-variant-numeric:tabular-nums}
tr.tappable{cursor:pointer}
tr.tappable:hover td{background:var(--surface-2)}

/* Archive */
.year-btn{border:0;background:transparent;padding:0;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--line)}
.year-btn:hover{text-decoration-color:var(--ink)}
.honour td{vertical-align:top;padding-block:12px}
.honour .who{font-size:12.5px;color:var(--muted);margin-top:2px}
.live-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);display:block;margin-top:4px}
.rec-list{display:flex;flex-direction:column;gap:5px;font-size:14px;margin:0;padding:0;list-style:none}
.rec-list li{display:flex;gap:10px;align-items:baseline}
.rec-list .yr{font-family:var(--f-display);font-weight:800;font-size:17px;min-width:42px;color:var(--muted)}
.rec-best{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.rec-best b{color:var(--ink)}
.sortbar{display:flex;gap:4px;flex-wrap:wrap}
.sortbar .tab{font-size:13px;padding:5px 10px}

.setup{display:flex;flex-direction:column;gap:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row>input[type=text],.row>.grow{flex:1;min-width:140px}
input[type=text],input[type=password]{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-width:0}
input[type=color]{width:40px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);color:var(--bg);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.savebar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar-in .msg{flex:1;min-width:160px;font-size:14px;font-weight:600}
.savebar .btn{background:transparent;color:var(--bg);border-color:var(--muted)}
.savebar .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}

.pin{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:16px;margin-top:16px;display:flex;flex-direction:column;gap:10px;max-width:420px}
.pin .err{color:var(--danger);font-size:13px;margin:0}
.notice{background:var(--surface-2);border-radius:var(--r);padding:10px 12px;font-size:13.5px;margin-top:12px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
footer{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .5s ease}}
input.score{width:90px;text-align:right;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.dir{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.dir button{border:0;background:transparent;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.dir button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.rec-new{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:#111;border-radius:999px;padding:2px 7px;vertical-align:middle}
.rec-by{font-size:12.5px;color:var(--muted)}
.rec-name{font-weight:700}
h3.sub{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.mp-set{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 12px;font-size:14px}
.mp-set input{width:52px;text-align:center;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px}
.matches{display:flex;flex-direction:column;gap:8px}
.m-round{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.match{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.match.pending{border-style:dashed}
.m-row{display:grid;grid-template-columns:1fr auto auto auto 1fr;align-items:center;gap:8px}
.match.ro .m-row{grid-template-columns:1fr auto 1fr}
.m-team{min-width:0;overflow:hidden}
.m-team.r{text-align:right;justify-self:end}
.m-team.won .chip{font-weight:800}
.m-v{color:var(--muted);font-size:13px;text-align:center}
.m-score{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;white-space:nowrap}
.m-out{font-size:13px;color:var(--muted);text-align:center}
.m-res{align-self:center;max-width:100%}
.m-res button{white-space:nowrap}
input.score.ms{width:54px}
@media (max-width:600px){
  body{font-size:14px}
  h1{font-size:clamp(38px,11vw,56px)}
  h2{font-size:23px}
  .acro{font-size:12.5px}
  .motto{font-size:14px}
  .motto span{font-size:11px}
  .status{font-size:12px}
  .team{grid-template-columns:34px 1fr auto;padding:10px 12px 10px 8px;gap:10px}
  .team .rk{font-size:30px}
  .team-name{font-size:15px}
  .team-members{font-size:11.5px}
  .pts b{font-size:28px}
  .pts small{font-size:11px}
  table{font-size:13px}
  th{font-size:10px}
  .rkc{font-size:17px;width:34px}
  .pl-name{font-size:13.5px}
  .chip{font-size:11.5px}
  .bigpts{font-size:18px}
  .medal{min-width:19px;height:19px;font-size:11px}
  .ev-name{font-size:16px}
  .ev-no{font-size:24px}
  .crown-title{font-size:28px}
  .crown-name{font-size:21px}
  .crown-who,.crown-recs ul{font-size:13px}
  .btn{font-size:13px}
  .m-row{grid-template-columns:1fr auto auto auto 1fr;gap:6px}
  .m-res button{padding:5px 9px;font-size:12px}
}
.hero.compact{padding-block:0 12px;align-items:center}
.hero.compact h1{font-size:clamp(30px,7vw,44px)}
.hero.compact .acro,.hero.compact .motto,.hero.compact .eyebrow{display:none}
@media (max-width:600px){
  .hero.compact .hero-side{flex-direction:row;align-items:center;justify-content:space-between}
  .tabs{gap:2px}
  .tab{padding:7px 11px;font-size:13.5px}
  td,th{padding-inline:8px}
  .score-tbl td:first-child{max-width:120px}
  .score-tbl .chip{font-size:11.5px}
  input.score{width:62px;padding:6px}
  .score-tbl .bigpts{font-size:19px}
}
.crown{position:relative;background:var(--surface);border:2px solid var(--gold);border-radius:var(--r);padding:18px 18px 16px;margin-top:16px;display:flex;flex-direction:column;gap:8px;box-shadow:inset 8px 0 0 var(--tc)}
.crown .eyebrow{color:var(--gold)}
.crown-title{font-size:clamp(30px,7vw,46px);margin:0;text-wrap:balance}
.crown-who{margin:0;font-size:14.5px;color:var(--muted)}
.crown-who b{color:var(--ink)}
.crown-champ{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;border-top:1px solid var(--line);padding-top:10px}
.crown-name{font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;line-height:1}
.crown-recs{border-top:1px solid var(--line);padding-top:10px}
.crown-recs ul{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.mv{display:block;font-family:var(--f-body);font-size:11px;font-weight:700;line-height:1.2;margin-top:2px;letter-spacing:0}
.rkc .mv{display:inline-block;margin:0 0 0 4px;vertical-align:middle}
.mv.up{color:var(--good)} .mv.down{color:var(--danger)} .mv.same{color:var(--muted)}
.more-btn{margin-top:8px;width:100%;justify-content:center}
.rc-wrap{padding:8px 4px}
.rc{display:block;width:100%;min-width:520px;height:auto}
.rc-grid{stroke:var(--line);stroke-width:1}
.rc-tick{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.rc-lbl{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.rc-end{fill:var(--ink);font-family:var(--f-body);font-size:12.5px;font-weight:600}
.rc-v{font-family:var(--f-display);font-weight:800;font-size:15px}
.rc-pt{stroke:var(--surface);stroke-width:1.5}
.ev-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.ev-wrap .ev{flex:1}
.ev-move{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.hero{border-bottom:2px solid var(--ink)}
.motto{color:var(--gold);border-color:var(--gold)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.team.lead{border-color:var(--gold);border-left-color:var(--tc);box-shadow:0 0 0 1px var(--gold)}
.bar{background:var(--surface-2)}
.medal.b{color:#fff}
.savebar .btn.primary{background:var(--surface);color:var(--ink);border-color:var(--surface)}
.yearbar{display:flex;gap:6px;overflow-x:auto;padding-block:2px 6px;margin-top:4px;scrollbar-width:none}
.yearbar::-webkit-scrollbar{display:none}
.yearbar .tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13px;padding:6px 14px;flex:none}
.yearbar .tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#fff}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);vertical-align:middle;margin-left:4px}
.seeall{border:0;background:none;padding:0;font-size:13px;font-weight:700;color:var(--gold)}
.pcard{margin-top:18px}
.plist2{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pa{display:grid;grid-template-columns:24px 12px minmax(0,1fr) 70px 44px 34px;align-items:center;gap:8px;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;width:100%;text-align:left;font-size:14px}

  sortAll:'pct',menu:false,pw:null,pwAll:false,allInd:ss.get('cc-allind')==='1',pinOpen:false,pinErr:'',signing:false,confirm:null,saving:false,canWrite:null,toast:null,prof:null};

function cur(){return draft||state;}
function dirty(){return !!draft&&JSON.stringify(draft)!==JSON.stringify(state);}
function edit(){if(!draft)draft=clone(state);return draft;}
function teamOf(s,id){for(var i=0;i<s.teams.length;i++)if(s.teams[i].id===id)return s.teams[i];return null;}
function evById(s,id){return s.events.filter(function(e){return e.id===id;})[0];}
function isH2H(ev){return ev.kind==='h2h';}
function hasResults(ev){if(ev.kind==='pts'){var pp=ev.points||{};for(var k0 in pp)if(isNum(pp[k0]))return true;return false;}if(isH2H(ev)){var m=ev.matches||[];return m.length>0&&m.every(function(x){return !!x.res;});}var r=ev.scores||{};for(var k in r)if(isNum(r[k]))return true;return false;}
function inProgress(ev){return isH2H(ev)&&!hasResults(ev)&&(ev.matches||[]).some(function(x){return !!x.res;});}
/* Round robin (circle method): everyone plays everyone once */
function fixtures(ids){
  var t=ids.slice(),out=[];if(t.length%2)t.push(null);var n=t.length;
  for(var r=0;r<n-1;r++){for(var i=0;i<n/2;i++){var a=t[i],b=t[n-1-i];if(a&&b)out.push({a:a,b:b,round:r+1,sa:'',sb:'',res:null});}t.splice(1,0,t.pop());}
  return out;
}
function newH2H(teams){return {kind:'h2h',mp:{w:3,d:1,l:0},matches:fixtures(teams.map(function(t){return t.id;})),scores:{}};}
/* Event league table: match points, then score difference (only when scores were entered), else a shared place */
function h2hTable(ev,teams){
  var mp=ev.mp||{w:3,d:1,l:0},R={},order={};
  teams.forEach(function(t,i){order[t.id]=i;R[t.id]={id:t.id,p:0,w:0,d:0,l:0,f:0,a:0,pts:0};});
  var anyScore=false;
  (ev.matches||[]).forEach(function(m){var A=R[m.a],B=R[m.b];if(!A||!B||!m.res)return;A.p++;B.p++;
    if(isNum(m.sa)&&isNum(m.sb)){anyScore=true;A.f+=+m.sa;A.a+=+m.sb;B.f+=+m.sb;B.a+=+m.sa;}
    if(m.res==='a'){A.w++;B.l++;A.pts+=+mp.w;B.pts+=+mp.l;}else if(m.res==='b'){B.w++;A.l++;B.pts+=+mp.w;A.pts+=+mp.l;}else{A.d++;B.d++;A.pts+=+mp.d;B.pts+=+mp.d;}});
  var rows=Object.keys(R).map(function(k){var r=R[k];r.diff=r.f-r.a;r.key=r.pts+'|'+(anyScore?r.diff:0);return r;});
  rows.sort(function(x,y){return y.pts-x.pts||(anyScore?y.diff-x.diff:0)||order[x.id]-order[y.id];});
  var rank=0,prev=null;rows.forEach(function(r,i){if(r.key!==prev){rank=i+1;prev=r.key;}r.rank=rank;});
  return {rows:rows,anyScore:anyScore};
}

/* ---------- Scoring ----------
   Points per place: N players in the year -> 1st scores N, last scores 1.
   Tied scores share the places they cover, averaged (two tied 1st of 16 = (16+15)/2 = 15.5 each). */
function evalEvent(ev,s){
  var players=s.players;
  if(ev.kind==='pts'){
    /* Team event from past years: CC points were entered directly; place = rank by points */
    var pp=ev.points||{},lst=players.filter(function(p){return isNum(pp[p.id]);}).map(function(p){return {id:p.id,v:+pp[p.id]};}),oo={};
    lst.sort(function(a,b){return b.v-a.v;});
    lst.forEach(function(x,i){var pl=1;for(var q=0;q<lst.length;q++)if(lst[q].v>x.v)pl++;oo[x.id]={place:pl,pts:x.v,score:null,last:false};});
    if(lst.length>1){var lv=lst[lst.length-1].v;lst.forEach(function(x){if(x.v===lv)oo[x.id].last=true;});}
    return oo;
  }
  if(isH2H(ev)){
    if(!hasResults(ev))return {};
    var rows=h2hTable(ev,s.teams).rows,N0=players.length,slot=0,o={},i0=0;
    while(i0<rows.length){
      var j0=i0;while(j0+1<rows.length&&rows[j0+1].key===rows[i0].key)j0++;
      var ids=[];for(var q=i0;q<=j0;q++)players.forEach(function(p){if(p.team===rows[q].id)ids.push(p.id);});
      var tot=0;for(var z=0;z<ids.length;z++)tot+=Math.max(N0-slot-z,0);
      var each=ids.length?tot/ids.length:0;
      ids.forEach(function(id){o[id]={place:i0+1,pts:each,score:null,last:false};});
      slot+=ids.length;i0=j0+1;
    }
    if(rows.length>1){var lk=rows[rows.length-1].key;rows.forEach(function(rw){if(rw.key===lk)players.forEach(function(p){if(p.team===rw.id&&o[p.id])o[p.id].last=true;});});}
    return o;
  }
  var N=players.length,sc=ev.scores||{},low=!!ev.low;
  var list=players.filter(function(p){return isNum(sc[p.id]);}).map(function(p){return {id:p.id,score:+sc[p.id]};});
  list.sort(function(a,b){return low?a.score-b.score:b.score-a.score;});
  var out={},i=0,k;
  while(i<list.length){
    var j=i; while(j+1<list.length&&list[j+1].score===list[i].score)j++;
    var sum=0; for(k=i;k<=j;k++)sum+=Math.max(N-k,0);
    for(k=i;k<=j;k++)out[list[k].id]={place:i+1,pts:sum/(j-i+1),score:list[k].score,last:false};
    i=j+1;
  }
  if(list.length>1){var ls=list[list.length-1].score;list.forEach(function(x){if(x.score===ls)out[x.id].last=true;});}
  return out;
}
function compute(s){
  var P={},T={},R={};
  s.players.forEach(function(p){P[p.id]={pts:0,g:0,s:0,b:0,played:0,won:0,lost:0,by:{}};});
  s.teams.forEach(function(t){T[t.id]={pts:0,by:{}};});
  s.events.forEach(function(ev){
    var r=evalEvent(ev,s),any=hasResults(ev); R[ev.id]=r;
    s.teams.forEach(function(t){T[t.id].by[ev.id]=any?0:null;});
    s.players.forEach(function(p){
      var x=r[p.id],q=P[p.id]; q.by[ev.id]=x?x.pts:null; if(!x)return;
      q.pts+=x.pts; q.played++;
      if(x.place===1){q.g++;q.won++;} else if(x.place===2)q.s++; else if(x.place===3)q.b++;
      if(x.last)q.lost++;
      if(T[p.team]){T[p.team].pts+=x.pts;T[p.team].by[ev.id]+=x.pts;}
    });
  });
  return {P:P,T:T,R:R};
}
function ranked(list,key){var out=[],prev=null,rank=0;list.forEach(function(it,i){var k=key(it);if(k!==prev){rank=i+1;prev=k;}out.push({it:it,rank:rank});});return out;}
function rankLabel(r,arr){var n=0;arr.forEach(function(x){if(x.rank===r)n++;});return (n>1?'=':'')+r;}
function sortTeams(s,c){return s.teams.slice().sort(function(a,b){return c.T[b.id].pts-c.T[a.id].pts||a.name.localeCompare(b.name);});}
function sortPlayers(s,c){return s.players.slice().sort(function(a,b){var A=c.P[a.id],B=c.P[b.id];return B.pts-A.pts||B.g-A.g||B.s-A.s||B.b-A.b||a.name.localeCompare(b.name);});}

/* ---------- Archive ----------
   Archived year: {year, teams:[{name,color,members:[names]}], events:[{name,low,scores:{playerName:score}}]} */
function toArchive(s){
  var nameOf={};s.players.forEach(function(p){nameOf[p.id]=p.name;});
  return {year:s.year,
    teams:s.teams.map(function(t){return {name:t.name,color:t.color,members:s.players.filter(function(p){return p.team===t.id;}).map(function(p){return p.name;})};}),
    events:s.events.filter(hasResults).map(function(e){
      if(e.kind==='pts'){var pn={};Object.keys(e.points||{}).forEach(function(id){if(nameOf[id])pn[nameOf[id]]=e.points[id];});return {name:e.name,kind:'pts',points:pn};}
      if(isH2H(e)){var tn={};s.teams.forEach(function(t){tn[t.id]=t.name;});return {name:e.name,kind:'h2h',mp:e.mp,matches:(e.matches||[]).map(function(m){return {a:tn[m.a],b:tn[m.b],round:m.round,sa:m.sa,sb:m.sb,res:m.res};})};}
      var r={};Object.keys(e.scores).forEach(function(id){if(isNum(e.scores[id])&&nameOf[id])r[nameOf[id]]=+e.scores[id];});return {name:e.name,low:!!e.low,scores:r};})};
}
function archiveToState(a){
  var st={year:a.year,teams:[],players:[],events:[]},idOf={};
  (a.teams||[]).forEach(function(t,i){
    var tid='t'+i;st.teams.push({id:tid,name:t.name,color:t.color||PALETTE[i%PALETTE.length]});
    (t.members||[]).forEach(function(m){var pid='p'+st.players.length;idOf[nkey(m)]=pid;st.players.push({id:pid,name:m,team:tid});});
  });
  (a.events||[]).forEach(function(e,i){
    if(e.kind==='pts'){var pr={};
      Object.keys(e.points||{}).forEach(function(n){var k=nkey(n);if(!idOf[k]){var pid='p'+st.players.length;idOf[k]=pid;st.players.push({id:pid,name:n,team:null});}pr[idOf[k]]=e.points[n];});
      st.events.push({id:'e'+i,name:e.name,kind:'pts',points:pr,scores:{}});return;}
    if(e.kind==='h2h'){var ti={};st.teams.forEach(function(t){ti[nkey(t.name)]=t.id;});
      st.events.push({id:'e'+i,name:e.name,kind:'h2h',mp:e.mp,scores:{},matches:(e.matches||[]).map(function(m){return {a:ti[nkey(m.a)],b:ti[nkey(m.b)],round:m.round,sa:m.sa,sb:m.sb,res:m.res};})});return;}
    var r={};
    Object.keys(e.scores||{}).forEach(function(n){var k=nkey(n);if(!idOf[k]){var pid='p'+st.players.length;idOf[k]=pid;st.players.push({id:pid,name:n,team:null});}r[idOf[k]]=e.scores[n];});
    st.events.push({id:'e'+i,name:e.name,low:!!e.low,scores:r});
  });
  return st;
}
function summarise(a,live){
  var st=archiveToState(a),c=compute(st),ts=sortTeams(st,c);
  var top=ts.length?c.T[ts[0].id].pts:0;
  var teamWin=top>0?ts.filter(function(t){return c.T[t.id].pts===top;}):[];
  var ps=sortPlayers(st,c),b=ps[0]&&c.P[ps[0].id],champs=[];
  if(b&&b.pts>0)champs=ps.filter(function(p){return c.P[p.id].pts===b.pts;});
  return {a:a,st:st,c:c,teams:ts,teamWin:teamWin,champs:champs,live:!!live};
}
function allYears(s){
  var ys=(s.archive||[]).map(function(a){return summarise(a,false);});
  if(s.events.some(hasResults)&&!(s.archive||[]).some(function(a){return String(a.year)===String(s.year);}))ys.push(summarise(toArchive(s),true));
  return ys.sort(function(x,y){return (parseInt(y.a.year,10)||0)-(parseInt(x.a.year,10)||0);});
}
function membersOf(sm,t){return sm.st.players.filter(function(p){return p.team===t.id;}).map(function(p){return p.name;});}

function teamChip(t,big){return '<span class="chip" style="--tc:'+esc(t.color)+(big?';color:var(--ink);font-weight:600;font-size:14px':'')+'"><span class="dot"></span>'+esc(t.name)+'</span>';}

/* Movers: rank change caused by the most recent event in running order */
function movers(s,c,ts){
  var done=s.events.filter(hasResults); if(done.length<2) return null;
  var last=done[done.length-1], s0=clone(s); evById(s0,last.id).scores={};
  var c0=compute(s0),T={},P={};
  ranked(sortTeams(s0,c0),function(t){return c0.T[t.id].pts;}).forEach(function(x){T[x.it.id]=x.rank;});
  ranked(sortPlayers(s0,c0),function(p){return c0.P[p.id].pts;}).forEach(function(x){P[x.it.id]=x.rank;});
  return {T:T,P:P,after:last.name};
}
function mvHtml(prev,now){
  if(prev==null) return '';
  var d=prev-now;
  if(d>0) return '<span class="mv up" title="Up '+d+' since the last event">▲'+d+'</span>';
  if(d<0) return '<span class="mv down" title="Down '+(-d)+' since the last event">▼'+(-d)+'</span>';
  return '<span class="mv same" title="No change since the last event">–</span>';
}
/* Records set this year, compared with everything before it */
/* Team size of a year's teams (largest team), used to keep Cup totals comparable: pairs vs teams of 4 */
function teamSizeOf(st,t){return st.players.filter(function(p){return p.team===t.id;}).length;}
function sizeLabel(n){return n===2?'pairs':n===1?'solo':'teams of '+n;}
function recordsSet(s){
  var Lg=s.legacy||{},prior=(s.archive||[]).filter(function(a){return String(a.year)!==String(s.year);}).map(function(a){return summarise(a);}),out=[];
  s.events.forEach(function(ev){
    if(!hasResults(ev))return;var low=!!ev.low,k=ekey(ev.name),best=null;
    (Lg.events||[]).forEach(function(le){if(ekey(le.name)===k&&le.best!=null)best=le.best;});
    prior.forEach(function(y){y.st.events.forEach(function(e){if(ekey(e.name)!==k)return;Object.keys(e.scores).forEach(function(id){var v=e.scores[id];if(isNum(v)&&(best==null||better(+v,best,low)))best=+v;});});});
    var r=evalEvent(ev,s),top=null,who=[];
    s.players.forEach(function(p){var x=r[p.id];if(!x||!isNum(x.score))return;if(top==null||better(x.score,top,low)){top=x.score;who=[p.name];}else if(x.score===top)who.push(p.name);});
    if(top!=null&&(best==null||better(top,best,low)))out.push({title:ev.name,v:top,who:who,prev:best});
  });
  var cbs={},hb=Lg.champion?Lg.champion.best:null;

/* ---------- Power ranking (Elo) ----------

function eloRun(s,dropLast){

  });

      nw[a]=R[a]+ELO_K*(act-exp)/(n-1);});

function powerData(s){

      if(played){ch=a2-(b2==null?ELO_START:b2);chLabel='in '+lastY;}else chLabel='Missed '+lastY;}

  });

  if(prevRank){var pl=rows.map(function(x){return {key:x.key,v:prevRank[x.key]!=null?prevRank[x.key]:ELO_START};}).sort(function(a,b){return b.v-a.v;});pr={};pl.forEach(function(x,i){pr[x.key]=i+1;});}

function raceChart(s,c,ts){
  var evs=s.events.filter(hasResults); if(!evs.length) return '';
  var W=680,H=300,L=44,R=130,T=18,B=44,pw=W-L-R,ph=H-T-B,n=evs.length;
  var series=ts.map(function(t){var acc=0,pts=[0];evs.forEach(function(e){acc+=c.T[t.id].by[e.id]||0;pts.push(acc);});return {t:t,pts:pts};});
  var max=1; series.forEach(function(sr){sr.pts.forEach(function(v){if(v>max)max=v;});});
  var raw=max/4,mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)),step=mag;
  [1,2,2.5,5,10].some(function(m){if(m*mag>=raw){step=m*mag;return true;}return false;});
  var top=Math.ceil(max/step)*step;
  function X(i){return L+i*pw/n;} function Y(v){return T+ph-v/top*ph;}
  var g='<svg class="rc" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Team totals after each event">';
  for(var v=0;v<=top+1e-9;v+=step){var y=Y(v).toFixed(1);g+='<line class="rc-grid" x1="'+L+'" x2="'+(L+pw)+'" y1="'+y+'" y2="'+y+'"/><text class="rc-lbl" x="'+(L-8)+'" y="'+y+'" dy="4" text-anchor="end">'+fmt(v)+'</text>';}
  for(var i=0;i<=n;i++){var x=X(i).toFixed(1),nm=i===0?'Start':evs[i-1].name;if(nm.length>11)nm=nm.slice(0,10)+'…';
    g+='<line class="rc-tick" x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+ph)+'"/><text class="rc-lbl" x="'+x+'" y="'+(T+ph+18)+'" text-anchor="middle">'+esc(nm)+'</text>';}
  series.forEach(function(sr){
    var d=sr.pts.map(function(v,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);}).join(' ');
    g+='<path d="'+d+'" fill="none" stroke="'+esc(sr.t.color)+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    sr.pts.forEach(function(v,i){if(!i)return;g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===n?5:3.5)+'" fill="'+esc(sr.t.color)+'" class="rc-pt"><title>'+esc(sr.t.name)+' after '+esc(evs[i-1].name)+': '+fmt(v)+'</title></circle>';});
  });
  var ends=series.map(function(sr){var v=sr.pts[n];return {t:sr.t,v:v,y:Y(v)};}).sort(function(a,b){return a.y-b.y;});
  for(var k=1;k<ends.length;k++){if(ends[k].y-ends[k-1].y<16)ends[k].y=ends[k-1].y+16;}
  var over=ends.length?ends[ends.length-1].y-(T+ph):0; if(over>0)ends.forEach(function(e){e.y-=over;});
  ends.forEach(function(e){g+='<text class="rc-end" x="'+(L+pw+10)+'" y="'+e.y.toFixed(1)+'" dy="4"><tspan style="fill:'+esc(e.t.color)+'">●</tspan> '+esc(e.t.name.length>12?e.t.name.slice(0,11)+'…':e.t.name)+' <tspan class="rc-v">'+fmt(e.v)+'</tspan></text>';});
  g+='</svg>';
  return '<section><h2>Race to the Cup</h2><p class="sec-note">Each team’s running total after every event.</p><div class="tbl-wrap rc-wrap">'+g+'</div></section>';
}

/* Career average performance %: each event scores (CC points - 1) / (players - 1), so 1st = 100% and last = 0%
   whatever the field size. Every event counts (team events too), matching the track-record workbook.
   Ranked only with PCT_MIN events or more. */
var PCT_MIN=5;
function careerPerf(ys){
  var M={};
  ys.forEach(function(y){var N=y.st.players.length;if(N<2)return;
    y.st.events.forEach(function(ev){if(!hasResults(ev))return;var r=y.c.R[ev.id];
      y.st.players.forEach(function(p){var x=r[p.id];if(!x)return;var k=nkey(p.name),m=M[k]=M[k]||{sum:0,n:0};m.sum+=(x.pts-1)/(N-1);m.n++;});});});
  var list=Object.keys(M).filter(function(k){return M[k].n>=PCT_MIN;}).sort(function(a,b){return M[b].sum/M[b].n-M[a].sum/M[a].n;});
  var rk=ranked(list,function(k){return Math.round(M[k].sum/M[k].n*1000);});
  rk.forEach(function(x){M[x.it].rank=x.rank;M[x.it].tied=rankLabel(x.rank,rk).charAt(0)==='=';});
  Object.keys(M).forEach(function(k){M[k].pct=M[k].sum/M[k].n;});
  return {M:M,ranked:list.length};
}
function pctTxt(v){return Math.round(v*100)+'%';}
function renderAllTime(s,ys){
  var M={};
  function get(name){var k=nkey(name);if(!M[k])M[k]={name:name,played:0,won:0,lost:0,cups:0,champs:0,pts:0,pct:null,ok:false};return M[k];}
  ((s.legacy||{}).players||[]).forEach(function(l){var m=get(l.name);['played','won','lost','cups','champs','pts'].forEach(function(f){m[f]+=+l[f]||0;});});
  s.players.forEach(function(p){get(p.name);});
  ys.forEach(function(y){
    y.st.players.forEach(function(p){var q=y.c.P[p.id],m=get(p.name);m.name=p.name;m.played+=q.played;m.won+=q.won;m.lost+=q.lost;m.pts+=q.pts;});
    if(y.live)return;
    y.teamWin.forEach(function(t){membersOf(y,t).forEach(function(n){get(n).cups++;});});
    y.champs.forEach(function(p){get(p.name).champs++;});
  });
  var CP=careerPerf(ys);Object.keys(CP.M).forEach(function(k){if(M[k]){M[k].pct=CP.M[k].pct;M[k].ok=CP.M[k].n>=PCT_MIN;}});
  var rows=Object.keys(M).map(function(k){return M[k];});
  if(!rows.length)return '';
  var key={points:function(m){return [m.pts,m.won,-m.lost];},wins:function(m){return [m.won,m.pts,-m.lost];},titles:function(m){return [m.cups+m.champs,m.champs,m.pts];},pct:function(m){return [m.ok?1:0,m.pct==null?-1:Math.round(m.pct*1000),m.played,m.pts];}}[ui.sortAll]||function(m){return [m.pts];};
  rows.sort(function(a,b){var A=key(a),B=key(b);for(var i=0;i<A.length;i++){if(B[i]!==A[i])return B[i]-A[i];}return a.name.localeCompare(b.name);});
  var rr=ranked(rows,function(m){return key(m).join('|');});
  var unr=function(m){return ui.sortAll==='pct'&&!m.ok;};
  var h='<section><div class="sec-head"><h2>All-time statistics</h2><div class="sortbar" aria-label="Sort all-time table">'
    +[['pct','Avg %'],['points','Points'],['wins','Wins'],['titles','Titles']].map(function(o){return '<button class="tab" data-act="sort-all" data-v="'+o[0]+'" aria-selected="'+(ui.sortAll===o[0])+'">'+o[1]+'</button>';}).join('')
    +'</div></div><p class="sec-note">Every Cup since 2021, plus '+esc(s.year)+' so far. Avg % is average performance per event: 1st scores 100%, last 0%, whatever the field size. You need '+PCT_MIN+' events to be ranked on it. Won is an event win; lost is finishing last.</p>'
    +'<div class="tbl-wrap"><table><thead><tr><th>#</th><th>Player</th><th class="r">Avg %</th><th class="r">CC Pts</th><th class="c">Played</th><th class="c">Won</th><th class="c">Lost</th><th class="c">Cups</th><th class="c">Champion</th></tr></thead><tbody>';
  function z(n){return n?n:'<span class="dash">0</span>';}
  rr.forEach(function(x){var m=x.it;h+='<tr'+(unr(m)?' class="unr"':'')+'><td class="rkc num">'+(unr(m)?'<span class="dash">\u2013</span>':rankLabel(x.rank,rr))+'</td><td class="pl-name">'+pLink(m.name)+'</td><td class="r num'+(ui.sortAll==='pct'&&m.ok?' bigpts':'')+'">'+(m.pct!=null?pctTxt(m.pct):'<span class="dash">\u2013</span>')+'</td><td class="r num'+(ui.sortAll==='pct'?'':' bigpts')+'">'+fmt(m.pts)+'</td><td class="c num">'+m.played+'</td><td class="c num">'+z(m.won)+'</td><td class="c num">'+z(m.lost)+'</td><td class="c num">'+z(m.cups)+'</td><td class="c num">'+z(m.champs)+'</td></tr>';});

    case 'rebuild':ui.confirm='rebuild';break;
    case 'rebuild-yes':d=edit();var eh=evById(d,ui.ev);eh.matches=fixtures(d.teams.map(function(t){return t.id;}));ui.confirm=null;break;
    case 'clear':ui.confirm='clear';break;
    case 'clear-yes':d=edit();evById(d,ui.ev).scores={};ui.confirm=null;break;
    case 'confirm-no':ui.confirm=null;break;
    case 'add-player':d=edit();d.players.push({id:uid('p'),name:'New player',team:d.teams[0].id});break;
    case 'del-player':ui.confirm='p:'+v;break;
    case 'del-player-yes':d=edit();d.players=d.players.filter(function(p){return p.id!==v;});d.events.forEach(function(e){delete e.scores[v];});ui.confirm=null;break;
    case 'del-event':ui.confirm='e:'+v;break;
    case 'del-event-yes':d=edit();d.events=d.events.filter(function(e){return e.id!==v;});ui.confirm=null;break;
    case 'ev-up':case 'ev-down':d=edit();var i=-1;d.events.forEach(function(e,k){if(e.id===v)i=k;});var j=a==='ev-up'?i-1:i+1;if(i>=0&&j>=0&&j<d.events.length){var tmp=d.events[i];d.events[i]=d.events[j];d.events[j]=tmp;}break;
    case 'crown':ui.confirm='crown';break;
    case 'crown-yes':d=edit();d.archive=(d.archive||[]).filter(function(x){return String(x.year)!==String(d.year);});d.archive.push(toArchive(d));d.final=true;
      ui.confirm=null;ui.tab='standings';ui.ev=null;ss.set('cc-tab','standings');ss.del('cc-ev');toast('Champions crowned. Publish to announce it.');return;
    case 'reopen':ui.confirm='reopen';break;
    case 'reopen-yes':d=edit();d.final=false;d.archive=(d.archive||[]).filter(function(x){return String(x.year)!==String(d.year);});ui.confirm=null;break;
    case 'next':ui.confirm='next';break;
    case 'next-yes':d=edit();d.archive=(d.archive||[]).filter(function(x){return String(x.year)!==String(d.year);});d.archive.push(toArchive(d));
      d.year=(parseInt(d.year,10)||new Date().getFullYear())+1;d.events.forEach(function(e){e.scores={};});d.final=false;ui.confirm=null;
      toast('Ready for '+d.year+'. Set the teams, then publish.');return;
    case 'del-year':ui.confirm='y:'+ui.year;break;
    case 'del-year-yes':d=edit();d.archive=(d.archive||[]).filter(function(x){return String(x.year)!==String(ui.year);});ui.year=null;ss.del('cc-year');ui.confirm=null;break;
    default:return;
  }
  render();
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&ui.prof){ui.prof=null;render();}});
APP.addEventListener('input',function(ev){
  var el=ev.target,d,v;
  if(el.hasAttribute('data-ms')){
    d=edit();var e3=evById(d,ui.ev),mi=+el.getAttribute('data-ms'),m3=e3.matches[mi],raw=el.value.trim().replace(',','.');
    m3[el.getAttribute('data-side')==='a'?'sa':'sb']=isNum(raw)?+raw:'';
    if(isNum(m3.sa)&&isNum(m3.sb))m3.res=+m3.sa>+m3.sb?'a':+m3.sb>+m3.sa?'b':'d';
    var box=document.getElementById('m-'+mi);if(box)box.querySelectorAll('[data-act="mres"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===mi+':'+m3.res));});
    var tb=document.getElementById('h2h-table');if(tb)tb.innerHTML=h2hTableHtml(d,e3);
    var cn=document.getElementById('h2h-count');if(cn){var pl=e3.matches.filter(function(x){return x.res;}).length;cn.textContent='\u00b7 '+pl+' of '+e3.matches.length+' played';}
    updateBar();return;
  }
  if(el.hasAttribute('data-mp')){
    d=edit();var e4=evById(d,ui.ev),rv=el.value.trim().replace(',','.');e4.mp=e4.mp||{w:3,d:1,l:0};
    if(isNum(rv)){e4.mp[el.getAttribute('data-mp')]=+rv;var tb2=document.getElementById('h2h-table');if(tb2)tb2.innerHTML=h2hTableHtml(d,e4);}
    updateBar();return;
  }
  if(el.hasAttribute('data-sc')){
    d=edit();v=el.getAttribute('data-sc');var e=evById(d,ui.ev),val=el.value.trim().replace(',','.');
    if(isNum(val))e.scores[v]=+val;else delete e.scores[v];
    var r=evalEvent(e,d);
    d.players.forEach(function(p){var x=r[p.id],a=document.getElementById('pp-'+p.id),b=document.getElementById('pt-'+p.id);if(a)a.textContent=x?ordinal(x.place):'–';if(b)b.textContent=x?fmt(x.pts):'–';});
    updateBar();return;
  }
  var k=el.getAttribute('data-in');if(!k)return;
  d=edit();v=el.getAttribute('data-v');var val2=el.value;
  if(k==='team-name')teamOf(d,v).name=val2;
  else if(k==='player-name')d.players.forEach(function(p){if(p.id===v)p.name=val2;});
  else if(k==='event-name')evById(d,v).name=val2;
  updateBar();
});
APP.addEventListener('change',function(ev){
  var el=ev.target,k=el.getAttribute('data-ch');
  if(el.hasAttribute('data-in'))return render();
  if(!k)return;
  var d=edit(),v=el.getAttribute('data-v'),val=el.value;
  if(k==='team-color')teamOf(d,v).color=val;
  else if(k==='player-team')d.players.forEach(function(p){if(p.id===v)p.team=val;});
  else if(k==='event-dir'){var ev2=evById(d,v);
    if(val==='h2h'){if(!isH2H(ev2)){var nh=newH2H(d.teams);ev2.kind='h2h';ev2.mp=nh.mp;ev2.matches=nh.matches;ev2.scores={};}}
    else{if(isH2H(ev2)){delete ev2.kind;delete ev2.matches;delete ev2.mp;ev2.scores={};}ev2.low=(val==='low');}}
  else if(k==='year'){var y=val.trim();if(y)d.year=y;}
  else if(k==='date'){var dv=val.trim();if(!dv)delete d.date;else if(/^\d{4}-\d{2}-\d{2}$/.test(dv))d.date=dv;}
  render();
});
APP.addEventListener('submit',function(ev){
  ev.preventDefault();
  var f=ev.target,kind=f.getAttribute('data-form');
  if(kind==='add-event'){
    var inp=f.querySelector('input'),dir=f.querySelector('select'),nm=(inp&&inp.value||'').trim();
    if(!nm){toast('Type the event name first.');return;}
    var dd=edit();
    if(dir&&dir.value==='h2h'){var ne=newH2H(dd.teams);ne.id=uid('e');ne.name=nm;dd.events.push(ne);}
    else dd.events.push({id:uid('e'),name:nm,low:!!dir&&dir.value==='low',scores:{}});
    toast(nm+' added. Publish to share it.');return;
  }
  if(kind!=='pin')return;
  var em=((document.getElementById('pin-email')||{}).value||'').trim(),pw=(document.getElementById('pin-in')||{}).value||'';
  ui.email=em;
  if(!em||!pw){ui.pinErr='Enter your email and password.';render();return;}
  if(!window.CupFb){ui.pinErr='Can\u2019t reach the scoreboard right now. Check your signal and try again.';render();return;}
  ui.signing=true;ui.pinErr='';render();
  window.CupFb.signIn(em,pw).then(function(){ui.signing=false;ui.pinOpen=false;render();})
  .catch(function(e){ui.signing=false;var c=e&&e.code||'';
    ui.pinErr=(c.indexOf('invalid')>=0||c.indexOf('wrong-password')>=0||c.indexOf('user-not-found')>=0)?'That email and password don\u2019t match. Try again.':c==='auth/too-many-requests'?'Too many tries. Wait a minute and try again.':'Couldn\u2019t sign in. Check your signal and try again.';render();});
});
function updateBar(){
  var m=APP.querySelector('.savebar');if(!m)return render();
  var d=dirty(),tmp=document.createElement('div');
  tmp.innerHTML='<div class="savebar"><div class="savebar-in"><span class="msg">'+(d?'Unsaved changes':'Scorekeeper mode · everything saved')+'</span>'+(d?'<button class="btn small" data-act="discard">Discard</button><button class="btn small primary" data-act="save">Publish scores</button>':'')+'</div></div>';
  m.replaceWith(tmp.firstChild);
}

/* ---------- Publish (Firebase) ----------
   The whole scoreboard is one document (cup/state). Each publish bumps "rev"; the save only goes through
   if nobody else has published since this phone last loaded, so two scorekeepers can't overwrite each other. */
function save(){
  if(!dirty())return;
  if(!window.CupFb){toast('Can\u2019t reach the scoreboard right now. Check your signal and try again.');return;}
  ui.saving=true;render();
  var next=clone(draft);next.updatedAt=new Date().toISOString();next.rev=(state.rev||0)+1;
  window.CupFb.save(next,state.rev||0).then(function(){draft=null;state=next;ui.saving=false;toast('Published. Everyone sees the new scores.');})
  .catch(function(e){ui.saving=false;var c=e&&e.code||'';
    if(c==='cup/conflict'){draft=null;toast('Someone else published first. Showing their scores \u2013 re-enter yours if needed.');}
    else if(c==='permission-denied'){ui.canWrite=false;toast('This login can\u2019t publish scores.');}
    else toast('Couldn\u2019t publish. Check your signal and try again.');
    render();});
}
/* Called by the Firebase bridge */
window.CupApp={
  remote:function(st){
    if(!st||typeof st!=='object')return;
    var changed=JSON.stringify(st)!==JSON.stringify(state);state=st;if(!state.archive)state.archive=[];
    if(!changed)return;
    if(draft&&!ui.saving){toast('New scores were just published. Discard yours to see them, or publish to overwrite.');}
    render();
  },
  user:function(u){
    ui.user=u;ui.unlocked=!!u;if(u){ui.email=u.email||ui.email;ui.canWrite=null;}else{ui.menu=false;draft=null;}
    render();
  },
  seed:function(){return clone(state);}
};
APP.addEventListener('scroll',function(ev){var tr=ev.target;if(!tr||tr.id!=='lu-track')return;var i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
  [].slice.call(APP.querySelectorAll('.lu-dot')).forEach(function(d,k){d.setAttribute('aria-selected',String(k===i));});},true);
render();
if(window.CupFbReady)window.CupFbReady();
})();
</script>
<script type="module">import {initializeApp,initializeFirestore,persistentLocalCache,persistentSingleTabManager,doc,onSnapshot,runTransaction,getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from './firebase.js';
const app=initializeApp({"apiKey": "AIzaSyAxowlxCxMQnqbmk-nnsxyJ_pRkTgEy6hw", "authDomain": "ccup-scoreboard.firebaseapp.com", "projectId": "ccup-scoreboard", "storageBucket": "ccup-scoreboard.firebasestorage.app", "messagingSenderId": "227277315366", "appId": "1:227277315366:web:f7809879c0fa954d77b5e7"});
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentSingleTabManager()})});}catch(e){db=initializeFirestore(app,{});}
const auth=getAuth(app);
const ref=doc(db,'cup','state');
let user=null,exists=null;
function conflict(){const e=new Error('conflict');e.code='cup/conflict';return e;}
window.CupFb={
  signIn:(email,pw)=>signInWithEmailAndPassword(auth,email,pw),
  signOut:()=>signOut(auth),
  save:(next,expectRev)=>runTransaction(db,async tx=>{
    const snap=await tx.get(ref);
    if(snap.exists()){const cur=JSON.parse(snap.data().data||'{}');if((cur.rev||0)!==expectRev)throw conflict();}
    tx.set(ref,{data:JSON.stringify(next),rev:next.rev,updatedAt:next.updatedAt,by:user?user.email:''});
  })
};
function start(){
  onSnapshot(ref,snap=>{
    exists=snap.exists();
    if(exists){try{window.CupApp.remote(JSON.parse(snap.data().data));}catch(e){console.error(e);}}
    else maybeSeed();
  },err=>console.error('scoreboard listener',err));
  onAuthStateChanged(auth,u=>{user=u;window.CupApp.user(u?{email:u.email}:null);maybeSeed();});
}
/* First sign-in on an empty database copies the scoreboard (history included) into it */
function maybeSeed(){
  if(exists!==false||!user)return;
  const st=window.CupApp.seed();st.rev=1;st.updatedAt=new Date().toISOString();
  runTransaction(db,async tx=>{const s=await tx.get(ref);if(!s.exists())tx.set(ref,{data:JSON.stringify(st),rev:1,updatedAt:st.updatedAt,by:user.email});}).catch(e=>console.error('seed',e));
}
if(window.CupApp)start();else window.CupFbReady=start;
</script>
